name: "CodeQL"

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]
  schedule:
    - cron: '0 8 * * 0'

jobs:
  analyse:
    name: Analyse
    runs-on: windows-2022
    permissions:
      actions: read # Required for CodeQL to read the workflow run
      contents: read # Required for checkout
      security-events: write # Required for uploading the CodeQL results
    if: ${{ !(github.actor == 'dependabot[bot]' && contains(fromJSON('["push"]'), github.event_name)) }}
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 2
        persist-credentials: false
    - name: Initialize CodeQL
      uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      with:
        languages: c-cpp
        build-mode: manual
    - name: Build
      shell: cmd
      run: .\build.cmd x64 0.0.0
    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
